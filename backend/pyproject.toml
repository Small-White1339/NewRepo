[project]
name = "smarthire-backend"
version = "0.1.0"
description = "SmartHire - AI-powered recruitment assistant system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4,<1.8",
    "bcrypt>=4.0.0,<4.2",
    "python-multipart>=0.0.12",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.2",
    "alembic>=1.14.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "loguru>=0.7.2",
    "httpx>=0.28.0",
    "langchain-openai>=1.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pyright]
typeCheckingMode = "basic"
include = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
